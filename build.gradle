plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.testng:testng:7.1.0'
}

test {
    // Используем JUnit для тестов JUnit 4
    useJUnit()

    // ИСПРАВЛЕНИЕ: добавляем TestNG отдельно
    useTestNG() {
        // Эта настройка гарантирует, что TestNG тесты будут найдены
        useDefaultListeners = true
    }

    // ВАЖНО: настройки для корректного завершения
    failFast = true              // Остановка при первом упавшем тесте
    ignoreFailures = false       // НЕ игнорировать падающие тесты

    // Настройка логирования для отладки
    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
        exceptionFormat "full"
    }
}

// ДОБАВЛЯЕМ: явная настройка для поиска тестов
tasks.withType(Test) {
    // Ищем все тесты в стандартных пакетах
    include '**/*Test.class'
    include '**/*Tests.class'
    include '**/*TestNG.class'

    // Используем JUnit Platform для совместимости
    useJUnitPlatform()
}