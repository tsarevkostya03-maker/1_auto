name: Java CI with Gradle

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build without tests
        run: ./gradlew build -x test  # ← Сборка БЕЗ тестов

      - name: Run tests
        run: ./gradlew test --no-daemon  # ← Тесты отдельно
        # При падении тестов этот шаг упадет, и весь CI станет красным ❌

      - name: Upload test reports
        if: always()  # ← Загружаем отчёты даже при падении
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/